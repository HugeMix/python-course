# Проверка и публикация сайта.
# При каждом изменении в main: сначала проверка (уроки, тесты, задачи, страницы в браузере),
# и только если она прошла — публикация на GitHub Pages. Если проверка нашла ошибку,
# на сайте остаётся прежняя рабочая версия, а у изменения появляется красный крестик.
# В pull request выполняется только проверка, без публикации.
# Важно: в настройках репозитория Settings → Pages → Source должно стоять «GitHub Actions».
name: Проверка и публикация сайта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - name: Установить инструменты проверки
        run: npm ci --no-audit --no-fund

      - name: Проверить код уроков, тесты и задачи
        run: node check-content.cjs

      # Системные пакеты для браузера скачиваются с серверов Ubuntu. Если они временно недоступны
      # (так бывает у GitHub), ставим браузер без них: на машинах GitHub почти всё нужное уже есть.
      - name: Установить браузер
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Проверить страницы в браузере
        run: node check-pages.cjs

  deploy:
    name: Публикация
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать файлы сайта (без папок проверки)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'checks' --exclude '_site' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
